# PostgreSQL, like the real nova-api.
#
# Defaults match the docker-compose.yml at the root, which listens on 5433 so
# it can't collide with a local PostgreSQL on 5432. To point at a PostgreSQL you
# already run, export DATABASE_HOST / DATABASE_PORT / DATABASE_USERNAME /
# DATABASE_PASSWORD, or set DATABASE_URL, which takes precedence.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch('RAILS_MAX_THREADS', 5) %>
  host: <%= ENV.fetch('DATABASE_HOST', 'localhost') %>
  port: <%= ENV.fetch('DATABASE_PORT', 5433) %>
  username: <%= ENV.fetch('DATABASE_USERNAME', 'postgres') %>
  password: <%= ENV.fetch('DATABASE_PASSWORD', 'postgres') %>

development:
  <<: *default
  database: tech_test_nova_development

test:
  <<: *default
  database: tech_test_nova_test
